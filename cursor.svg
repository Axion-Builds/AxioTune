<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="20%" stop-color="rgba(255,255,255,0.0)" />
    </linearGradient>
  </defs>
  <!-- Main shape with shadow and gradient -->
  <path d="M 5,5 L 28,13 C 30,14 30,16 28,17 L 17,20 L 12,30 C 11,32 9,31 8,29 L 5,5 Z" fill="url(#grad)" filter="url(#shadow)"/>
  <!-- Highlight overlay to make it look 3D and shiny -->
  <path d="M 5,5 L 28,13 C 30,14 30,16 28,17 L 17,20 L 12,30 C 11,32 9,31 8,29 L 5,5 Z" fill="url(#highlight)"/>
  <!-- Subtle border/edge reflection -->
  <path d="M 5,5 L 28,13 C 30,14 30,16 28,17 L 17,20 L 12,30 C 11,32 9,31 8,29 L 5,5 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5"/>
</svg>
